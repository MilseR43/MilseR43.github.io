<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CCC cookie clicker club </title>
</head>

<body>
    <h1>
        CCC Click
    </h1>
    <h2>
        <button id="clickButton">Click me!</button>
        <p>Clicks: <span id="clickCountDisplay"></span></p>
        <button id="Upgrade1"> first Upgrade at 10 clicks</button>
        <button id="SlotMachine">Gamble for the chance of a prize for 100 clicks</button>
        <button id="SlotMachine2">Gamble for the chance of a rare prize for 100 clicks </button>
    
    </h2>
    <h3>
        <audio id="ekhSfx" controls src="audio/ekh.mp3" hidden></audio>
        <audio id="slotMachineWinSfx" controls src="audio/mixkit-christmas-magic-bell-hit-939.wav" hidden></audio>
        <audio id="slotMachineLoseSfx" controls src="audio/creaking-ship-sound-effect.mp3" hidden></audio>
        <img src="images/creakingShip.jpg" id="slotMachineLoseImg" alt="A creaking-ship-sound-effect" hidden>
        <img src="images/win.jpg" id="slotMachineWinImg" alt="Win" hidden>
    </h3>
    <h4>
        <a href="index.html">back to home page</a>
    </h4>

    <script src="clicker_game.js"></script>
</body>

</html>
