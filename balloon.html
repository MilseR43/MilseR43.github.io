<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Agu+Display&family=Lacquer&family=Architects+Daughter&family=Mansalva&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>balloon game</title>
</head>
<body>
    <h1 class="headers"> Try pressing the up and down arrow keys!</h1>
     <a class="links" href="index.html">home page</a>
    <p id="baloon">🎈</p>

    <script>
        let balloonEl = document.getElementById("baloon");
        let fontSize = 10;
        function handleKeyDown(event) {
            if (event.key == "ArrowUp") {
                fontSize *= 1.1;
                balloonEl.style.fontSize = fontSize + "px";
                event.preventDefault();
            }
            if (event.key == "ArrowDown") {
                fontSize /= 1.1;
                balloonEl.style.fontSize = fontSize + "px";
                event.preventDefault();
            }
        }
        window.addEventListener("keydown", handleKeyDown);
    </script>

</body>

</html>
